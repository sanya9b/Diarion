name: CI

# The suite is fast and green and, until this file existed, ran nowhere except on the developer's
# machine. Everything below is what `dotnet test` already does locally — the point is that it now
# happens on every push, including the pushes made in a hurry.
on:
  push:
  pull_request:
    branches: [develop, main]

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  tests:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Cache NuGet
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      # Diarion.Core and Diarion.Tests are plain net10.0 but set UseMaui, so the MAUI SDK targets
      # are still required. `workload restore` reads the project instead of guessing a workload id.
      - name: Restore workloads
        run: dotnet workload restore Diarion.Tests/Diarion.Tests.csproj

      # No parallelism flags on purpose: xUnit parallelization is disabled in the test project
      # because LiteDB's global mapper races. Plain `dotnet test` is the configuration that is
      # known to be stable, so this runs exactly that.
      - name: Test
        run: dotnet test Diarion.Tests/Diarion.Tests.csproj --logger "trx;LogFileName=results.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: '**/results.trx'
          if-no-files-found: ignore

  android-permissions:
    name: Android release asks for exactly the approved permissions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Cache NuGet
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-android-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: nuget-android-${{ runner.os }}-

      - name: Restore workloads
        run: dotnet workload restore Diarion.csproj

      # Release, not Debug: debug builds get extra permissions injected for the debugger, so only
      # the release manifest describes what users actually install.
      - name: Build Android release
        run: dotnet build Diarion.csproj -f net10.0-android -c Release

      # What the shipped APK asks for is the product's main privacy claim, and it is the kind of
      # thing a single added package can undo without anyone noticing — a dependency's own manifest
      # gets folded in by the merger, and a human reading a diff will not catch that. This will.
      #
      # This is an allowlist, not a ban on two names. Until 2026-08-02 the app asked for no network
      # permission at all; INTERNET now exists solely to download AI model files (specs/13). That
      # made the exact-set check more important, not less: it is what catches an accidental unpin of
      # Microsoft.ML.OnnxRuntimeGenAI 0.14.1, whose 0.15.1 AAR declares INTERNET *and* installs a
      # telemetry ContentProvider.
      #
      # FOREGROUND_SERVICE and FOREGROUND_SERVICE_DATA_SYNC joined on 2026-08-10, for that same one
      # feature: Android suspends a backgrounded process, so a locked screen stopped a 1.1 GB model
      # download dead. Neither grants access to any data. WAKE_LOCK is deliberately absent — see the
      # comment in Platforms/Android/AndroidManifest.xml.
      #
      # Adding a permission here is a deliberate act. It should show up in a diff, be justified in
      # the PR, and be reflected in the store listing — never arrive as a side effect of a package.
      - name: Assert the release manifest asks for exactly the approved permissions
        run: |
          MANIFEST=obj/Release/net10.0-android/AndroidManifest.xml
          if [ ! -f "$MANIFEST" ]; then
            echo "::error::Generated manifest not found at $MANIFEST"
            exit 1
          fi

          cat > /tmp/allowed-permissions.txt <<'EOF'
          android.permission.ACCESS_NETWORK_STATE
          android.permission.FOREGROUND_SERVICE
          android.permission.FOREGROUND_SERVICE_DATA_SYNC
          android.permission.INTERNET
          android.permission.POST_NOTIFICATIONS
          android.permission.RECEIVE_BOOT_COMPLETED
          android.permission.USE_BIOMETRIC
          android.permission.USE_FINGERPRINT
          android.permission.VIBRATE
          EOF
          sort -u -o /tmp/allowed-permissions.txt /tmp/allowed-permissions.txt

          grep -o 'uses-permission android:name="[^"]*"' "$MANIFEST" \
            | sed 's/.*android:name="//; s/"$//' \
            | sort -u > /tmp/actual-permissions.txt

          echo "Permissions in the release manifest:"
          cat /tmp/actual-permissions.txt

          UNEXPECTED=$(comm -13 /tmp/allowed-permissions.txt /tmp/actual-permissions.txt)
          MISSING=$(comm -23 /tmp/allowed-permissions.txt /tmp/actual-permissions.txt)

          STATUS=0
          if [ -n "$UNEXPECTED" ]; then
            echo "::error::The release manifest requests permissions that are not on the allowlist:"
            echo "$UNEXPECTED" | while read -r P; do echo "::error::  + $P"; done
            echo "::error::A dependency probably injected these. Either drop the dependency, or add"
            echo "::error::the permission here deliberately and update the store listing to match."
            STATUS=1
          fi
          if [ -n "$MISSING" ]; then
            echo "::error::Allowlisted permissions are missing from the manifest:"
            echo "$MISSING" | while read -r P; do echo "::error::  - $P"; done
            echo "::error::If a feature was removed, shrink the allowlist in the same commit."
            STATUS=1
          fi

          [ "$STATUS" -eq 0 ] && echo "Exactly the approved permissions. Good."
          exit "$STATUS"
