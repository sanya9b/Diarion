name: Build iOS IPA

on:
  workflow_dispatch: # Дозволяє запускати збірку вручну кнопкою

jobs:
  build:
    runs-on: macos-26 # .NET 10.0.300 iOS workload (26.5.10301) requires Xcode 26.6

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Select Xcode 26.6
      # The .NET for iOS workload restored below requires Xcode 26.6, so select it.
      run: |
        echo "Installed Xcode versions:"
        ls -d /Applications/Xcode*.app || true
        # Prefer the canonical alias (Xcode_26.6.app). The patch-suffixed bundle
        # (Xcode_26.6.0.app) on this runner is missing the macOS SDK that actool needs.
        if [ -d /Applications/Xcode_26.6.app ]; then
          XCODE_PATH=/Applications/Xcode_26.6.app
        else
          XCODE_PATH=$(ls -d /Applications/Xcode_26.6*.app 2>/dev/null | head -n 1)
        fi
        if [ -z "$XCODE_PATH" ]; then
          echo "::error::Xcode 26.6 is not installed on this runner. See the list above and pin a matching .NET iOS workload instead."
          exit 1
        fi
        echo "Using Xcode at: $XCODE_PATH"
        sudo xcode-select -s "$XCODE_PATH/Contents/Developer"
        # DEVELOPER_DIR points at .../Contents/Developer, but MD_APPLE_SDK_ROOT
        # must point at the .app bundle root itself (not the Developer subfolder).
        echo "DEVELOPER_DIR=$XCODE_PATH/Contents/Developer" >> $GITHUB_ENV
        echo "MD_APPLE_SDK_ROOT=$XCODE_PATH" >> $GITHUB_ENV
        xcodebuild -version
        # Fail early (with a clear message) if the macOS SDK actool relies on is missing.
        xcrun --sdk macosx --show-sdk-path

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.300' # Використовуємо поточний SDK, сумісний з iOS workload 26.5

    - name: Restore required workloads
      run: dotnet workload restore Diarion.csproj --skip-manifest-update

    - name: Publish MAUI iOS App
      # Збираємо додаток без сертифікатів Apple Developer (CodesignKey="-")
      run: dotnet publish Diarion.csproj -f net10.0-ios -c Release -p:RuntimeIdentifier=ios-arm64 -p:CodesignKey="-" -p:CodesignProvision="-"

    - name: Package into IPA
      # Формуємо .ipa файл (це просто zip-архів з папкою Payload всередині)
      run: |
        APP_PATH=$(find . -type d -name "Diarion.app" | grep "Release" | head -n 1)
        mkdir -p Payload
        cp -R "$APP_PATH" Payload/
        zip -qr Diarion.ipa Payload
          
    - name: Upload IPA Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Diarion-iOS-App
        path: Diarion.ipa
