name: Swift widget extension

# The short loop for the WidgetKit extension (spec 20, R6). There is no Mac on the team, so this is
# where a Swift mistake shows up: the shared package's tests on the macOS host, then an unsigned build
# of DiarionWidgets.appex for a device — the same script build-ios.yml runs before it embeds the
# extension. A compile error here costs these few minutes, not a signed publish and a TestFlight round.

on:
  push:
    paths:
      - 'native/ios-widgets/**'
      - '.github/workflows/swift-widgets.yml'
  pull_request:
    paths:
      - 'native/ios-widgets/**'
      - '.github/workflows/swift-widgets.yml'
  workflow_dispatch:

jobs:
  extension:
    name: Test the shared package and build the extension
    runs-on: macos-26
    timeout-minutes: 25

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Select Xcode 26.6
      # Same toolchain the app is built with, so the extension and the app agree on the Swift ABI.
      run: |
        if [ -d /Applications/Xcode_26.6.app ]; then
          XCODE_PATH=/Applications/Xcode_26.6.app
        else
          XCODE_PATH=$(ls -d /Applications/Xcode_26.6*.app 2>/dev/null | head -n 1)
        fi
        if [ -z "$XCODE_PATH" ]; then
          echo "::error::Xcode 26.6 is not installed on this runner."
          ls -d /Applications/Xcode*.app || true
          exit 1
        fi
        sudo xcode-select -s "$XCODE_PATH/Contents/Developer"
        echo "DEVELOPER_DIR=$XCODE_PATH/Contents/Developer" >> $GITHUB_ENV
        xcodebuild -version
        swift --version

    - name: Install XcodeGen
      run: brew install xcodegen

    - name: Shared package tests (swift test, macOS host)
      run: swift test --package-path native/ios-widgets/DiarionWidgetsShared

    - name: Build the extension for a device (unsigned)
      run: bash native/ios-widgets/scripts/build-appex.sh iphoneos

    - name: Upload the extension
      uses: actions/upload-artifact@v4
      with:
        name: DiarionWidgets.appex
        path: native/ios-widgets/build/Release-iphoneos/DiarionWidgets.appex
        if-no-files-found: error
