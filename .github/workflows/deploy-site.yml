name: Deploy site

# diarion.org is a Cloudflare Worker that serves the static folder site/ (wrangler.jsonc at the repo
# root names it). Until this file existed the folder was uploaded by hand, and the live site fell a
# month and a half behind the repository (2026-10-25: no /terms page, "coming soon" over the App
# Store button). Now every push to main that touches site/ uploads the folder with Wrangler; nothing
# is built, there is nothing to build.
#
# Needs, in the repository settings (never in the repository itself — it is public):
#   Secrets  CLOUDFLARE_API_TOKEN   an API token with "Account → Workers Scripts → Edit"
#            CLOUDFLARE_ACCOUNT_ID  Workers & Pages → Overview → Account ID (right-hand column)
on:
  push:
    branches: [main]
    paths: ['site/**', 'wrangler.jsonc', '.github/workflows/deploy-site.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-site
  cancel-in-progress: true

jobs:
  deploy:
    name: Upload site/ to the diarion Worker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # The action's default is Wrangler 3.90 (2024), which rejects any compatibility_date newer
          # than itself; the current major knows the dates this file uses.
          wranglerVersion: '4'
          command: deploy

      - name: Check the live pages
        run: |
          sleep 20
          for path in / /terms /en/terms /privacy; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "https://diarion.org$path")
            echo "$path -> $code"
            [ "$code" = "200" ] || exit 1
          done
