# XcodeGen spec of the widget extension (spec 20, R6). There is no Mac in the team, so this file is the
# source of truth: the .xcodeproj, Info.plist and .entitlements are generated on the macOS runner
# (`xcodegen generate`) and never committed. Mirrors Burdock's ios-extensions/BurdockWidgets/project.yml.
name: DiarionWidgets
options:
  bundleIdPrefix: org.diarion
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
  xcodeVersion: "26.0"
settings:
  base:
    SWIFT_VERSION: "5.10"
    DEVELOPMENT_TEAM: 9XZ2FQC6B7
    # Overridden by build-ios.yml with ApplicationDisplayVersion / ApplicationVersion from Diarion.csproj:
    # App Store Connect warns when an extension's versions differ from the containing app's.
    MARKETING_VERSION: "1.2"
    CURRENT_PROJECT_VERSION: "24"
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
    TARGETED_DEVICE_FAMILY: "1"
    SWIFT_STRICT_CONCURRENCY: minimal
    SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
    GCC_TREAT_WARNINGS_AS_ERRORS: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: NO
packages:
  DiarionWidgetsShared:
    path: DiarionWidgetsShared
targets:
  DiarionWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: DiarionWidgets
    dependencies:
      - package: DiarionWidgetsShared
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
    info:
      path: DiarionWidgets/Info.plist
      properties:
        CFBundleDisplayName: Diarion
        CFBundleDevelopmentRegion: uk
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: DiarionWidgets/DiarionWidgets.entitlements
      properties:
        com.apple.security.application-groups:
          - group.org.diarion.app
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.diarion.app.widgets
        PRODUCT_NAME: DiarionWidgets
        SKIP_INSTALL: YES
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_STYLE: Manual
schemes:
  DiarionWidgets:
    build:
      targets:
        DiarionWidgets: all
